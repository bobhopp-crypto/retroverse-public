<ellipse cx="712.6" cy="564.6" rx="71.7" ry="84.4" fill="hsl(165 50% 38%)" opacity="0.096" filter="url(#v2-atmo-blur)"/>
<ellipse cx="1008.6" cy="499.5" rx="159.9" ry="51.9" fill="hsl(32 78% 42%)" opacity="0.093" filter="url(#v2-atmo-blur)"/>
<ellipse cx="785.5" cy="803.9" rx="123.1" ry="127.1" fill="hsl(165 50% 38%)" opacity="0.043" filter="url(#v2-atmo-blur)"/>

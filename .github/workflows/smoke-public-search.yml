name: Smoke test (public search)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Run public smoke test
        run: npm run smoke:public-search


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <defs>
    <style>
      .title { font: bold 30px Georgia, serif; fill: #1a1a1a; }
      .subtitle { font: 14px Helvetica, Arial, sans-serif; fill: #555; }
      .panel-title { font: bold 16px Helvetica, Arial, sans-serif; fill: #c2410c; }
      .tree { font: 13px Menlo, Monaco, monospace; fill: #1a1a1a; }
      .tree-bold { font: bold 13px Menlo, Monaco, monospace; fill: #1a1a1a; }
      .tree-dim { font: 12px Menlo, Monaco, monospace; fill: #666; }
      .tree-warn { font: 12px Menlo, Monaco, monospace; fill: #b45309; }
      .box { fill: #f4eeda; stroke: #1a1a1a; stroke-width: 2.5; rx: 6; }
      .box-multi { fill: #fde8c8; stroke: #c2410c; stroke-width: 2.5; rx: 6; }
      .box-ops { fill: #e8f0ee; stroke: #1a5c52; stroke-width: 2.5; rx: 6; }
      .box-warn { fill: #fff3d6; stroke: #b45309; stroke-width: 2; rx: 6; stroke-dasharray: 5 4; }
      .label { font: bold 14px Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .small { font: 11px Helvetica, Arial, sans-serif; fill: #333; }
      .badge { font: bold 10px Helvetica, Arial, sans-serif; fill: #fff; }
      .arrow { stroke: #1a1a1a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-loop { stroke: #c2410c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowhead-orange); }
      .arrow-ops { stroke: #1a5c52; stroke-width: 2; fill: none; marker-end: url(#arrowhead-ops); }
      .arrow-bidir { stroke: #1a5c52; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c2410c"/>
    </marker>
    <marker id="arrowhead-ops" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a5c52"/>
